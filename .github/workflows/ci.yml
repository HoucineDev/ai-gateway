name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: aigw, POSTGRES_PASSWORD: aigw, POSTGRES_DB: aigw_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aigw" --health-interval 5s --health-timeout 5s --health-retries 10
      valkey:
        image: valkey/valkey:8
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]"
      - name: Independence gate (source + environment)
        run: python scripts/independence_gate.py
      - run: ruff check src tests
      - run: pytest -q
        env:
          AIGW_TEST_DATABASE_URL: postgresql+asyncpg://aigw:aigw@localhost:5432/aigw_test
          AIGW_TEST_VALKEY_URL: redis://localhost:6379/9

  image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t aigw:ci -f deploy/compose/Dockerfile .
      - name: Independence gate (image layers + SBOM)
        run: |
          docker image save aigw:ci | tar -t > image-files.txt
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
          syft aigw:ci -o cyclonedx-json > sbom.json
          python scripts/independence_gate.py --image-files image-files.txt --sbom sbom.json
      - uses: actions/upload-artifact@v4
        with: { name: sbom, path: sbom.json }
