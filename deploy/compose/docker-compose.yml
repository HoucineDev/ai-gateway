# Local development stack (docs/spec/05 §2). No external credentials needed: mock-upstream serves
# OpenAI-compatible and Anthropic-compatible endpoints.
services:
  postgres:
    image: postgres:16
    environment: { POSTGRES_USER: aigw, POSTGRES_PASSWORD: aigw, POSTGRES_DB: aigw }
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U aigw"], interval: 5s, timeout: 5s, retries: 10 }

  valkey:
    image: valkey/valkey:8
    ports: ["6379:6379"]

  mock-upstream:
    build: { context: ../.., dockerfile: deploy/compose/Dockerfile }
    command: ["python", "-m", "aigw.testing.mock_upstream"]
    ports: ["9000:9000"]
    healthcheck:  # image default probes :8080 (gateway/admin); the mock listens on :9000
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:9000/healthz').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    build: { context: ../.., dockerfile: deploy/compose/Dockerfile }
    command: ["sh", "-c", "aigw migrate && aigw bootstrap /etc/aigw/bootstrap.yaml"]
    environment: &env
      AIGW_DATABASE_URL: postgresql+asyncpg://aigw:aigw@postgres:5432/aigw
      AIGW_VALKEY_URL: redis://valkey:6379/0
      AIGW_ADMIN_KEY: ${AIGW_ADMIN_KEY:-change-me-admin}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-test-anthropic-key}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on: { postgres: { condition: service_healthy } }

  gateway:
    build: { context: ../.., dockerfile: deploy/compose/Dockerfile }
    environment: { <<: *env, AIGW_ROLE: gateway }
    ports: ["8080:8080"]
    depends_on: { migrate: { condition: service_completed_successfully }, valkey: { condition: service_started } }

  admin:
    build: { context: ../.., dockerfile: deploy/compose/Dockerfile }
    environment:
      <<: *env
      AIGW_ROLE: admin
      # Keycloak bearer tokens on the control API (docs/spec/01 §3.1). Harmless while the `oidc` profile is not
      # running: the admin key keeps working and bearer callers get 503 oidc_unavailable.
      AIGW_OIDC_ISSUER: http://localhost:8180/realms/aigw
      AIGW_OIDC_AUDIENCE: aigw-portal
      AIGW_OIDC_JWKS_URL: http://keycloak:8080/realms/aigw/protocol/openid-connect/certs
    ports: ["8081:8080"]
    depends_on: { migrate: { condition: service_completed_successfully } }

  worker:
    build: { context: ../.., dockerfile: deploy/compose/Dockerfile }
    command: ["aigw", "worker"]
    environment: { <<: *env, AIGW_ROLE: worker }
    healthcheck: { disable: true }  # no HTTP listener; liveness is the process
    depends_on: { migrate: { condition: service_completed_successfully } }

  keycloak:
    # Opt-in identity provider for the control API: docker compose --profile oidc up -d keycloak
    # Imports deploy/compose/keycloak/realm-aigw.json (roles aigw-admin/operator/viewer, client aigw-portal,
    # users alice/bob/carol/dan with password = username). Console: http://localhost:8180 (admin/admin).
    image: quay.io/keycloak/keycloak:26.3
    profiles: ["oidc"]
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: http://localhost:8180  # pins `iss` so tokens verify whichever host fetched them
      KC_HTTP_ENABLED: "true"
    ports: ["8180:8080"]
    volumes: ["./keycloak:/opt/keycloak/data/import:ro"]

volumes:
  pgdata: {}
