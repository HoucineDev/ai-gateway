# Example ArgoCD multi-source Application (RKE2 / GitOps). Values live beside the chart or in a separate values repo.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ai-gateway
  namespace: argocd
spec:
  project: default
  destination: { server: https://kubernetes.default.svc, namespace: ai-gateway }
  sources:
    - repoURL: https://github.com/HoucineDev/ai-gateway.git
      targetRevision: main
      path: deploy/helm/ai-gateway
      helm:
        valueFiles: [$values/deploy/helm/values-prod.yaml]
    - repoURL: https://github.com/HoucineDev/ai-gateway.git
      targetRevision: main
      ref: values
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
